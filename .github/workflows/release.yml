name: Release

# Publishes one crate per tag. Tags are named `<crate>-v<version>`, for example,
# `anyver-v0.2.0`. Publishing uses crates.io trusted publishing through GitHub
# OIDC, so no long-lived registry token is stored in the repository.

on:
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    if: github.repository == 'silitics/si-rust-libs'
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Resolve Crate from Tag
        id: crate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          crate="${TAG%-v*}"
          version="${TAG##*-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
          if [ -z "$manifest_version" ]; then
            echo "::error::No crate named '$crate' in the workspace."
            exit 1
          fi
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Tag version $version does not match version $manifest_version of $crate."
            exit 1
          fi
          echo "name=$crate" >> "$GITHUB_OUTPUT"

      - name: Test Crate
        env:
          CRATE: ${{ steps.crate.outputs.name }}
        run: cargo test -p "$CRATE" --all-features --locked

      - name: Authenticate with Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish Crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ steps.crate.outputs.name }}
        run: cargo publish -p "$CRATE" --locked
